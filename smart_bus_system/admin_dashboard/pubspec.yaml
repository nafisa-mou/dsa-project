name: smart_bus_admin
description: Smart Bus Tracking System - Admin Dashboard (Web)
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase packages
  firebase_core: ^2.24.0
  firebase_auth: ^4.13.0
  firebase_firestore: ^4.13.0
  firebase_database: ^10.2.0

  # State Management
  provider: ^6.0.0
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # UI & Navigation
  get: ^4.6.5
  go_router: ^12.0.0

  # Data visualization & charts
  charts_flutter: ^0.12.0
  syncfusion_flutter_charts: ^23.1.0
  fl_chart: ^0.63.0

  # Data tables
  data_table_2: ^4.2.8
  pluto_grid: ^8.4.0

  # Utilities
  uuid: ^4.0.0
  intl: ^0.19.0
  shared_preferences: ^2.2.0
  http: ^1.1.0

  # PDF & Export
  pdf: ^3.10.0
  printing: ^5.11.0

  # Date & Time pickers
  syncfusion_flutter_datepicker: ^23.1.0

  # Maps for web
  google_maps: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
