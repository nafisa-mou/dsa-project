name: smart_bus_student
description: Smart Bus Tracking System - Student App
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase packages
  firebase_core: ^2.24.0
  firebase_auth: ^4.13.0
  firebase_firestore: ^4.13.0
  firebase_database: ^10.2.0
  firebase_messaging: ^14.6.0
  firebase_storage: ^11.2.0

  # Google Maps
  google_maps_flutter: ^2.5.0
  google_maps_webservice: ^5.0.0
  geolocator: ^9.0.2
  location: ^5.0.0

  # State Management
  provider: ^6.0.0
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # UI & Navigation
  get: ^4.6.5
  go_router: ^12.0.0
  cupertino_icons: ^1.0.0

  # Utilities
  uuid: ^4.0.0
  intl: ^0.19.0
  shared_preferences: ^2.2.0
  connectivity_plus: ^5.0.0
  http: ^1.1.0

  # Camera (for QR code scanning)
  camera: ^0.10.5
  qr_code_scanner: ^1.0.1

  # Animation & UI
  lottie: ^2.6.0
  animated_widgets: ^2.1.0
  flutter_animate: ^4.2.0

  # Development
  dio: ^5.3.0
  logger: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/data/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
