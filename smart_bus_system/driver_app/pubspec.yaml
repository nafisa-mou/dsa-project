name: smart_bus_driver
description: Smart Bus Tracking System - Driver App
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase packages
  firebase_core: ^2.24.0
  firebase_auth: ^4.13.0
  firebase_firestore: ^4.13.0
  firebase_database: ^10.2.0
  firebase_messaging: ^14.6.0

  # Google Maps
  google_maps_flutter: ^2.5.0
  geolocator: ^9.0.2
  location: ^5.0.0

  # State Management
  provider: ^6.0.0
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # UI & Navigation
  get: ^4.6.5
  go_router: ^12.0.0

  # Utilities
  uuid: ^4.0.0
  intl: ^0.19.0
  shared_preferences: ^2.2.0
  connectivity_plus: ^5.0.0

  # Notifications
  flutter_local_notifications: ^14.1.0

  # Animation & UI
  lottie: ^2.6.0
  flutter_animate: ^4.2.0

  # Background services
  background_fetch: ^1.1.0
  workmanager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
